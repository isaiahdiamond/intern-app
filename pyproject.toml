[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intern-app"
version = "0.1.0"
description = "Aggregates internship listings, extracts required skills with Claude, and ranks them against my profile."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69.0",
    "httpx>=0.28.1",
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "jinja2>=3.1.6",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.181.0",
    "google-auth-oauthlib>=1.2.2",
]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "pre-commit>=4.3.0",
    "respx>=0.22.0",
]

[project.scripts]
intern-app = "intern_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intern_app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "S",    # bandit — catches hardcoded secrets and unsafe calls
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
